name: Deploy Documentation

# Versioned docs (ADR 0011). gh-pages holds one folder per release line, plus root
# files written by src/scripts/docs-versions.py:
#   1.1/, 1.2/, ...   one per release line (a patch release rebuilds its line in place)
#   versions.json     the version selector's list; `latest` = the highest release line
#   index.html        redirects to the latest release
#   404.html          sends unversioned (pre-versioning) links, and links to the retired dev/
#                     docs, to the same page in the latest release
# Each run builds only the versions it is for and leaves the other folders alone. There is
# no dev version (retired 2026-11-20, ADR 0011 amendment): a docs merge deploys nothing,
# and released docs change with a release or a dispatch.
#
#   release: published, tag X.Y.Z ........ X.Y from the tag (not a prerelease)
#   schedule / discussion (roadmap) ...... the latest release from its newest tag
#   workflow_dispatch, no inputs ......... the latest release from its newest tag
#   workflow_dispatch, ref + version ..... that ref as that version, e.g. 1.1.0 as 1.1
# A line listed in src/scripts/docs-line-sources.txt is built from the ref given there on every
# trigger (1.1: main@036bec2, shown as 1.1.0; the 1.1.0 tag lacks the 1.1.0 docs).

on:
  release:
    types: [published]
  # Roadmap membership/status changes fire discussion events; upvote-based
  # re-ordering is picked up by the daily schedule (upvotes don't fire events).
  discussion:
    types: [created, edited, deleted, labeled, unlabeled]
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag (or commit) to build, e.g. 1.1.0. Leave blank to rebuild the latest release from its newest tag.'
        required: false
        default: ''
      version:
        description: 'Docs version to publish it as: a release line such as 1.1. Required with ref.'
        required: false
        default: ''

permissions:
  contents: write
  discussions: read

# One run per docs version at a time; a newer run for the same version supersedes one
# still in progress, so back-to-back runs can't publish out of order. Runs for different
# versions (a release and a roadmap refresh of the latest) don't cancel each other; they
# serialize on the gh-pages push below.
concurrency:
  group: deploy-docs-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version || 'latest' }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags: release versions are built from their tag

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r docs/requirements.txt

      - name: Choose the versions to build
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          IN_REF: ${{ inputs.ref }}
          IN_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin gh-pages:refs/remotes/origin/gh-pages
          # The latest release line (versions.json's `latest`) and its newest X.Y.Z tag.
          latest_target() {
            local vj="$RUNNER_TEMP/versions.json" latest="" tag=""
            if git show origin/gh-pages:versions.json > "$vj" 2>/dev/null; then
              latest=$(python -c 'import json, sys; print(next((v["version"] for v in json.load(open(sys.argv[1])) if "latest" in v["aliases"]), ""))' "$vj")
            fi
            [ -n "$latest" ] || return 0
            tag=$(git tag -l --sort=-v:refname "$latest.*" | grep -E "^${latest//./\\.}\.[0-9]+$" | head -1 || true)
            [ -z "$tag" ] || echo "$tag $latest"
          }
          targets=""
          case "$EVENT" in
            release)
              if [ "$PRERELEASE" = "true" ] || ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "Release $TAG is a prerelease or not X.Y.Z; no docs version to publish."
              else
                targets="$TAG ${TAG%.*}"
              fi
              ;;
            workflow_dispatch)
              if [ -n "$IN_REF" ]; then
                [ -n "$IN_VERSION" ] || { echo "::error::version is required with ref"; exit 1; }
                targets="$IN_REF $IN_VERSION"
              else
                targets=$(latest_target)
              fi
              ;;
            schedule|discussion)
              # Rebuild the latest release, so its Roadmap page stays current.
              targets=$(latest_target)
              ;;
          esac
          echo "Targets:"; echo "${targets:-(none)}"
          {
            echo "targets<<EOF"
            echo "$targets"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Each build overlays this checkout's versioning templates onto the ref, sets
      # site_url to .../<version>/, regenerates the Roadmap (non-fatal), and runs
      # `zensical build --clean --strict` and check-site-links.py.
      - name: Build docs versions
        if: steps.plan.outputs.targets != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETS: ${{ steps.plan.outputs.targets }}
        run: |
          set -euo pipefail
          while read -r ref version; do
            [ -n "$ref" ] || continue
            src/scripts/build-versioned-docs.sh "$ref" "$version" "built/$version"
          done <<< "$TARGETS"

      - name: Publish to gh-pages
        if: steps.plan.outputs.targets != ''
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # shellcheck disable=SC2012  # version names are X.Y
          versions=$(ls built | tr '\n' ' ')
          adds=""
          for v in $versions; do adds="$adds --add $v"; done
          # Another version's run may push first; start again from the new gh-pages tip.
          for attempt in 1 2 3 4 5; do
            git fetch --no-tags origin gh-pages:refs/remotes/origin/gh-pages
            rm -rf pages
            git worktree prune
            git worktree add --detach pages origin/gh-pages
            for v in $versions; do
              rsync -a --delete "built/$v/" "pages/$v/"
            done
            # shellcheck disable=SC2086
            python src/scripts/docs-versions.py pages $adds
            git -C pages add -A
            if git -C pages diff --cached --quiet; then
              echo "gh-pages already up to date."
              exit 0
            fi
            git -C pages commit -q -m "docs: publish ${versions% } from ${GITHUB_SHA::7}"
            if git -C pages push origin HEAD:gh-pages; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); retrying."
            sleep $((attempt * 5))
          done
          echo "::error::could not push to gh-pages"
          exit 1
