name: Deploy Documentation

on:
  release:
    types: [published]
  # Docs-only merges to main deploy immediately instead of waiting for the daily
  # schedule. Merges that touch none of these paths don't trigger a deploy.
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - '.github/workflows/deploy-docs.yml'
  # Roadmap membership/status changes fire discussion events; upvote-based
  # re-ordering is picked up by the daily schedule (upvotes don't fire events).
  discussion:
    types: [created, edited, deleted, labeled, unlabeled]
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:

permissions:
  contents: write
  discussions: read

# One deploy at a time; a newer run supersedes one still in progress, so
# back-to-back merges can't publish out of order.
concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r docs/requirements.txt

      # Regenerate the Roadmap table from GitHub Discussions labeled
      # "roadmap authorized" (ordered by upvotes). Non-fatal: a transient API
      # failure falls back to the committed snapshot rather than blocking deploy.
      - name: Generate roadmap from discussions
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python src/scripts/generate-roadmap.py

      - run: zensical build --clean --strict

      # --strict doesn't check #fragments or links in raw HTML (iframes, diagrams,
      # the console); check every internal link in the built site.
      - name: Check site links and anchors
        run: python src/scripts/check-site-links.py site

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: ./site
