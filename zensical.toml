    ] },
    { "VCV Statements" = [
      "pipeline/vcv-statements/index.md",
      { "Aggregation Rules" = "pipeline/vcv-statements/vcv-aggregation-rules.md" },
      { "VCV Procedures" = "pipeline/vcv-statements/vcv-proc.md" },
      { "VCV Extensions" = "pipeline/vcv-statements/vcv-extensions.md" },
    ] },
    { "RCV Statements" = [
      "pipeline/rcv-statements/index.md",
      { "RCV Procedures" = "pipeline/rcv-statements/rcv-proc.md" },
      { "RCV Extensions" = "pipeline/rcv-statements/rcv-extensions.md" },
    ] },
    { "Export & Distribute" = "pipeline/export.md" },
    { "Sub-Bundle Extraction" = "pipeline/sub-bundle.md" },
  ] },
  { Reference = [
    { Roadmap = "reference/roadmap.md" },
    { "GA4GH Standards" = "reference/gks-standards.md" },
    { "Known Issues" = "reference/known-issues.md" },
    { Glossary = "reference/glossary.md" },
    { Presentations = [
      "reference/presentations/index.md",
      { "ClinVar-GKM Primer" = "reference/presentations/clinvar-gkm-primer.md" },
    ] },
  ] },
]

[project.theme]
variant = "classic"
custom_dir = "docs/overrides"
logo = "assets/images/clingen-logo-white.svg"
features = [
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.indexes",
  "navigation.top",
  "search.suggest",
  "search.highlight",
  "content.code.copy",
  "toc.follow",
]

# Auto — follow the OS light/dark preference (first-visit default; matches the
# GKM Starter Kit, so jumping between the two sites stays consistent for
# system-theme users). Toggle cycles auto -> light -> dark.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "material/brightness-auto"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to system preference"

[project.plugins.search]

[project.markdown_extensions]
tables = {}
admonition = {}
attr_list = {}
md_in_html = {}
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.highlight.anchor_linenums = true
toc.permalink = true
