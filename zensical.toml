  # The ~75 individual class pages (output-reference/classes/Clinvar*.md etc.)
  # are deliberately NOT in the nav: Zensical builds every page in docs_dir,
  # doesn't warn about unlisted pages under --strict, and indexes them for
  # search. They are reached from the five group pages below and from each
  # other. Do not move or rename them (URL = file path; versioned site).
  { Reference = [
    { "Data Model" = [
      "output-reference/classes/index.md",
      { Variations   = "output-reference/classes/variations.md" },
      { Concepts     = "output-reference/classes/concepts.md" },
      { Propositions = "output-reference/classes/propositions.md" },
      { Statements   = "output-reference/classes/statements.md" },
      { Evidence     = "output-reference/classes/evidence.md" },
    ] },
    { Roadmap = "reference/roadmap.md" },
    { "Versioning & Releases" = "reference/versioning.md" },
    { Changelog = "reference/changelog.md" },
    { "Release Validation" = "reference/release-validation.md" },
    { "GA4GH Standards" = "reference/gks-standards.md" },
    { "Known Issues" = "reference/known-issues.md" },
    { FAQ = "reference/faq.md" },
    { Glossary = "reference/glossary.md" },
    { Presentations = [
      "reference/presentations/index.md",
      { "ClinVar-GKM Primer" = "reference/presentations/clinvar-gkm-primer.md" },
      { "What It Unlocks" = "reference/presentations/clinvar-gkm-unlocks.md" },
      { "Strict Profiles, Fast Tables" = "reference/presentations/clinvar-gkm-strict-profiles.md" },
    ] },
  ] },
]

# Versioned docs (ADR 0011): the theme's version selector reads versions.json at
# the site root. Each version is built into its own folder by
# src/scripts/build-versioned-docs.sh, which also sets site_url per version.
[project.extra.version]
provider = "mike"
alias = true

[project.theme]
variant = "classic"
custom_dir = "docs/overrides"
logo = "assets/images/clingen-logo-white.svg"
features = [
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.indexes",
  "navigation.top",
  "search.suggest",
  "search.highlight",
  "content.code.copy",
  "toc.follow",
]

# Auto — follow the OS light/dark preference (first-visit default; matches the
# GKM Starter Kit, so jumping between the two sites stays consistent for
# system-theme users). Toggle cycles auto -> light -> dark.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "material/brightness-auto"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to system preference"

[project.plugins.search]

[project.markdown_extensions]
tables = {}
admonition = {}
attr_list = {}
md_in_html = {}
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.highlight.anchor_linenums = true
toc.permalink = true
