repo_url = "https://github.com/clingen-data-model/clinvar-gkm"
repo_name = "clingen-data-model/clinvar-gkm"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
extra_css = ["stylesheets/extra.css"]
strict = true
nav = [
