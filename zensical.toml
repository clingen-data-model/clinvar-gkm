site_name = "ClinVar-GKM"
site_description = "ClinVar data transformation pipeline to GA4GH GKS format"
site_url = "https://clinvar-gkm.org/"
repo_url = "https://github.com/clingen-data-model/clinvar-gkm"
repo_name = "clingen-data-model/clinvar-gkm"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
extra_css = ["stylesheets/extra.css"]
extra_javascript = ["assets/js/r2-browser.js"]
strict = true
