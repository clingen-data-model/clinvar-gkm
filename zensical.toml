[project.theme]
variant = "classic"
custom_dir = "docs/overrides"
logo = "assets/images/clingen-logo-white.svg"
features = [
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.indexes",
  "navigation.top",
  "search.suggest",
  "search.highlight",
  "content.code.copy",
  "toc.follow",
]

# Auto — follow the OS light/dark preference (first-visit default; matches the
# GKM Starter Kit, so jumping between the two sites stays consistent for
# system-theme users). Toggle cycles auto -> light -> dark.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "material/brightness-auto"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to system preference"

[project.plugins.search]

[project.markdown_extensions]
tables = {}
admonition = {}
attr_list = {}
md_in_html = {}
pymdownx.details = {}
pymdownx.superfences = {}
pymdownx.highlight.anchor_linenums = true
toc.permalink = true
