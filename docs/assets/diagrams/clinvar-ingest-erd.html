<style>
  /* Theme-aware tokens, same light/dark contract as the other repo diagrams: a media-query default
     plus explicit :root[data-theme] overrides. Green = submitter data, blue = ClinVar-produced data,
     yellow = notes, as in the original ClinVar Phase 1 Model diagram. */
  :root {
    --bg: #FFFFFF; --ink: #1B2430; --muted: #5B6572; --faint: #8A939E; --rule: #E2E6EA;
    --line: #3B4652; --box: #FFFFFF;
    --sub: #DDF5DA; --sub-hd: #A9E3A3; --sub-bd: #4E8F47;
    --cv: #DCEEFB; --cv-hd: #8CCBF0; --cv-bd: #3F7FA8;
    --note: #FFFBD6; --note-bd: #B8A94A;
    --tag: #9A3B12;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171D24; --ink: #E7E9EC; --muted: #97A1AC; --faint: #707A85; --rule: #2A323B;
      --line: #A9B3BD; --box: #1B222A;
      --sub: #1C2B1D; --sub-hd: #2F5A2C; --sub-bd: #6FB466;
      --cv: #182633; --cv-hd: #24506E; --cv-bd: #6AAAD4;
      --note: #2E2B17; --note-bd: #8C7F3A;
      --tag: #F0A47E;
    }
  }
  :root[data-theme="dark"] {
    --bg: #171D24; --ink: #E7E9EC; --muted: #97A1AC; --faint: #707A85; --rule: #2A323B;
    --line: #A9B3BD; --box: #1B222A;
    --sub: #1C2B1D; --sub-hd: #2F5A2C; --sub-bd: #6FB466;
    --cv: #182633; --cv-hd: #24506E; --cv-bd: #6AAAD4;
    --note: #2E2B17; --note-bd: #8C7F3A;
    --tag: #F0A47E;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased; }
  /* Natural size; the embedding iframe scrolls when the diagram is wider than the column
     (deliberate repo choice -- no scale-to-fit, matches the other diagrams). */
  .frame { overflow: auto; padding: 4px; }
  svg.erd { display: block; font-family: var(--sans); }

  .tbl .bx { stroke-width: 1.1; }
  .tbl.sub .bx { fill: var(--sub); stroke: var(--sub-bd); }
  .tbl.cv .bx { fill: var(--cv); stroke: var(--cv-bd); }
  .sub .hd { fill: var(--sub-hd); stroke: var(--sub-bd); stroke-width: 1.1; }
  .cv .hd { fill: var(--cv-hd); stroke: var(--cv-bd); stroke-width: 1.1; }
  .tbl.unread .bx, .bx.dash { stroke-dasharray: 5 3; stroke-width: 1.4; }
  .bx.dash { fill: var(--box); stroke: var(--line); }
  .tn { font-size: 11.5px; font-weight: 700; fill: var(--ink); }
  .tn .tag { font-weight: 600; fill: var(--tag); }
  .cl { font-size: 10.5px; fill: var(--ink); }
  .cl.sub { fill: var(--muted); }
  .cl .ty { fill: var(--muted); }
  .mk { font-size: 9.5px; fill: var(--muted); font-style: italic; }

  .r { fill: none; stroke: var(--line); stroke-width: 1.1; }
  .dm.fd { fill: var(--line); stroke: var(--line); stroke-width: 1; }
  .dm.od { fill: var(--bg); stroke: var(--line); stroke-width: 1.1; }
  .m { font-size: 10px; fill: var(--ink); }
  .lb { font-size: 10px; fill: var(--muted); }

  .nt { fill: var(--note); stroke: var(--note-bd); stroke-width: 1; }
  .nf { fill: none; stroke: var(--note-bd); stroke-width: 1; }
  .nl { fill: none; stroke: var(--faint); stroke-width: 1; stroke-dasharray: 3 3; }
  .ntx { font-size: 10.5px; fill: var(--ink); }

  .lgbox { fill: var(--box); stroke: var(--rule); stroke-width: 1; }
  .lgt { font-size: 13px; font-weight: 700; fill: var(--ink); }
  .lgd { font-size: 10.5px; fill: var(--ink); }
</style>

<text class="ntx" x="31" y="367">ID = OrgID. One row per submitter.</text>

<path class="nt" d="M24,748 H296 L304,756 V797 H24 Z"/>
<path class="nf" d="M296,748 V756 H304"/>
<text class="ntx" x="31" y="763">ID = OrgID.SubmissionDate (3.2019-10-14).</text>
<text class="ntx" x="31" y="776">Submission names stay on the SCV</text>
<text class="ntx" x="31" y="789">(clinical_assertion.submission_names).</text>
<path class="nl" d="M520.0,274.0 L520.0,330.0"/>
<path class="nt" d="M410,212 H632 L640,220 V274 H410 Z"/>
<path class="nf" d="M632,212 V220 H640"/>
<text class="ntx" x="417" y="227">ID = SCV accession; internal_id is</text>
<text class="ntx" x="417" y="240">ClinVar&#x27;s integer record ID.</text>
<text class="ntx" x="417" y="253">rcv_accession_id is filled in from</text>
<text class="ntx" x="417" y="266">rcv_mapping after the load.</text>
<path class="nl" d="M304.0,900.0 L330.0,900.0"/>
<path class="nt" d="M24,850 H296 L304,858 V938 H24 Z"/>
<path class="nf" d="M296,850 V858 H304"/>
<text class="ntx" x="31" y="865">content holds Sample, Method,</text>
<text class="ntx" x="31" y="878">ObservedData and FunctionalData: the</text>
<text class="ntx" x="31" y="891">case-level and functional evidence not</text>
<text class="ntx" x="31" y="904">yet in GKM. bq-tools already parses</text>
<text class="ntx" x="31" y="917">them (parseSample, parseMethods,</text>
<text class="ntx" x="31" y="930">parseObservedData).</text>
<path class="nl" d="M304.0,1050.0 L330.0,1050.0"/>
<path class="nt" d="M24,1010 H296 L304,1018 V1072 H24 Z"/>
<path class="nf" d="M296,1010 V1018 H304"/>
<text class="ntx" x="31" y="1025">ID = SCV for the assertion&#x27;s TraitSet,</text>
<text class="ntx" x="31" y="1038">SCV.n for an observation&#x27;s TraitSet.</text>
<text class="ntx" x="31" y="1051">clinical_assertion_trait.id =</text>
<text class="ntx" x="31" y="1064">&lt;trait set id&gt;.n</text>

<text class="ntx" x="759" y="278">+ gene_id</text>

<path class="nt" d="M752,420 H884 L892,428 V456 H752 Z"/>
<path class="nf" d="M884,420 V428 H892"/>
<text class="ntx" x="759" y="435">ID = NCBI GeneID.</text>
<text class="ntx" x="759" y="448">One row per gene.</text>
<path class="nl" d="M870.0,812.0 L870.0,766.0"/>
<path class="nt" d="M752,812 H982 L990,820 V874 H752 Z"/>
<path class="nf" d="M982,812 V820 H990"/>
<text class="ntx" x="759" y="827">Maps a submitted trait (by name or</text>
<text class="ntx" x="759" y="840">xref) to a MedGen concept; the ingest</text>
<text class="ntx" x="759" y="853">uses it to set</text>
<text class="ntx" x="759" y="866">clinical_assertion_trait.trait_id.</text>
<path class="nl" d="M1370.0,1048.0 L1340.0,940.0"/>
<path class="nt" d="M1370,1042 H1692 L1700,1050 V1078 H1370 Z"/>
<path class="nf" d="M1692,1042 V1050 H1700"/>
<text class="ntx" x="1377" y="1057">ID = TraitSetID. Only the record&#x27;s</text>
<text class="ntx" x="1377" y="1070">ConditionList TraitSets.</text>
<path class="nl" d="M1370.0,1102.0 L1340.0,1080.0"/>
<path class="nt" d="M1370,1096 H1692 L1700,1104 V1132 H1370 Z"/>
<path class="nf" d="M1692,1096 V1104 H1700"/>
<text class="ntx" x="1377" y="1111">ID = TraitID; medgen_id is the MedGen</text>
<text class="ntx" x="1377" y="1124">CUI from the ConditionList.</text>
<path class="nt" d="M1400,914 H1692 L1700,922 V1028 H1400 Z"/>
<path class="nf" d="M1692,914 V922 H1700"/>
<text class="ntx" x="1407" y="929">The two *_classification tables hold one row</text>
<text class="ntx" x="1407" y="942">per VCV or RCV and statement type (germline,</text>
<text class="ntx" x="1407" y="955">somatic clinical impact, oncogenicity). An SCV</text>
<text class="ntx" x="1407" y="968">joins the one for its own statement_type; an</text>
<text class="ntx" x="1407" y="981">SCV with no classification provided has no</text>
<text class="ntx" x="1407" y="994">statement_type and joins neither. GKM derives</text>
<text class="ntx" x="1407" y="1007">VCV and RCV classifications from the SCVs, so</text>
<text class="ntx" x="1407" y="1020">it does not read these tables.</text>
<path class="nt" d="M1370,1160 H1692 L1700,1168 V1209 H1370 Z"/>
<path class="nf" d="M1692,1160 V1168 H1700"/>
<text class="ntx" x="1377" y="1175">rcv_mapping comes from the RCV release</text>
<text class="ntx" x="1377" y="1188">file (ClinVarSet); every other table</text>
<text class="ntx" x="1377" y="1201">comes from the VCV release file.</text>
