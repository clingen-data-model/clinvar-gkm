$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://w3id.org/clingen/schema/clinvar-gkm/1.1.0/clinvar-evidence-source.yaml"
title: ClinVar-GKM evidence line profiles
description: >-
  Profiles of the VA-Spec EvidenceLine type for the records of the evidenceLine bundle
  section: the evidence lines of VCV and RCV aggregate statements, which group the statements
  they aggregate, and the evidence lines of ClinVar somatic clinical impact (SCI) SCV
  statements, which carry a target proposition (therapeutic response, diagnostic, prognostic)
  and an evidence outcome based on the AMP/ASCO/CAP tiered classification system. Each
  profile composes EvidenceLine and narrows it to what the ClinVar-GKM pipeline writes: a
  property the pipeline never writes is declared false, and every reference is a pointer
  carrying the pattern of the sections it names.
strict: true

imports:
  va-core: ../va-spec/va-spec-source.yaml
  domain-entities: ../va-spec/domain-entities-source.yaml
  cat-vrs: ../cat-vrs/cat-vrs-source.yaml
  vrs: ../vrs/vrs-source.yaml
  gkm-core: ../gkm-core/gkm-core-source.yaml
  clinvar-concept: ./clinvar-concept-source.yaml
  clinvar-statement: ./clinvar-statement-source.yaml

namespaces:
  gkm.core: /ga4gh/schema/gkm-core/1.3.0/json/
  va-spec: /ga4gh/schema/va-spec/1.1.0/json/
  clinvar-gkm: /clingen/schema/clinvar-gkm/1.1.0/json/

$defs:
  # ─── VCV / RCV aggregate evidence lines ───

  ClinvarAggregateEvidenceLine:
    maturity: trial use
    description: >-
      An evidence line of a VCV or RCV aggregate statement. A 'Contributing' line (direction
      'supports') lists the statements the aggregate statement is built from; a
      'Non-contributing' line (direction 'neutral') lists those of a lower review-status
      priority that did not contribute. Its items are pointers to SCV statements (at the
      classification layer) or to VCV or RCV statements (at the priority and aggregate
      layers). No name, description, aliases, extensions, method, contributions, citations,
      target proposition, score or evidence outcome.
    allOf:
      - $refCurie: va-spec:EvidenceLine
      - type: object
        required: [id, strengthOfEvidenceProvided, hasEvidenceItems]
        properties:
          name: false
          description: false
          aliases: false
          extensions: false
          specifiedBy: false
          contributions: false
          reportedIn: false
          targetProposition: false
          scoreOfEvidenceProvided: false
          evidenceOutcome: false
          directionOfEvidenceProvided:
            type: string
            enum:
              - supports
              - neutral
            description: >-
              'supports' for a Contributing line, 'neutral' for a Non-contributing line.
          strengthOfEvidenceProvided:
            allOf:
              - $refCurie: clinvar-gkm:ClinvarTerm
              - type: object
                required: [name]
                properties:
                  conceptType:
                    type: string
                    const: Strength
                    description: Always 'Strength'.
                  name:
                    type: string
                    enum:
                      - Contributing
                      - Non-contributing
                    description: Whether the line's items contributed to the aggregate statement.
            description: >-
              'Contributing' or 'Non-contributing', as a ClinvarTerm of concept type
              'Strength'.
          hasEvidenceItems:
            type: array
            ordered: false
            items:
              $refCurie: gkm.core:iriReference
              pattern: "^#/(scv|vcv|rcv)/"
            description: >-
              The statements the line groups, each a '#/scv/<id>', '#/vcv/<id>' or
              '#/rcv/<id>' pointer into this bundle.

  # ─── SCV somatic clinical impact evidence lines ───

  ExtensionEvidenceLineSubmittedCondition:
    type: object
    maturity: trial use
    description: >-
      The submitter's original condition, for a somatic clinical impact submission with one
      condition. The same extension as the SCV statement's submittedCondition extension.
    protectedClassOf: ClinvarSomaticEvidenceLine
    properties:
      name:
        type: string
        const: submittedCondition
        description: Must be 'submittedCondition'.
      value:
        $refCurie: clinvar-gkm:SubmittedCondition
        description: >-
          The submitted condition mapping details, with the condition it resolved to.
    required: [name, value]

  ExtensionEvidenceLineSubmittedConditionSet:
    type: object
    maturity: trial use
    description: >-
      The submitter's original conditions, for a somatic clinical impact submission with two
      or more conditions. The same extension as the SCV statement's submittedConditionSet
      extension.
    protectedClassOf: ClinvarSomaticEvidenceLine
    properties:
      name:
        type: string
        const: submittedConditionSet
        description: Must be 'submittedConditionSet'.
      value:
        $refCurie: clinvar-gkm:SubmittedConditionSet
        description: >-
          The submitted condition set with mapping details for each condition.
    required: [name, value]

  ClinvarSomaticEvidenceLine:
    maturity: trial use
    description: >-
      The evidence line of a ClinVar somatic clinical impact (SCI) SCV statement. It links the
      statement's VariantClinicalSignificanceProposition to the specific assertion: its target
      proposition (a VariantTherapeuticResponseProposition, VariantDiagnosticProposition or
      VariantPrognosticProposition, in the propositionSomaticClinicalImpact section), always
      supported, with an evidence outcome reflecting the AMP/ASCO/CAP tier and the
      submitter's original condition(s) in an extension. No name, description, aliases,
      method, contributions, citations, evidence items, strength or score.
    allOf:
      - $refCurie: va-spec:EvidenceLine
      - type: object
        required: [id, evidenceOutcome, targetProposition]
        properties:
          name: false
          description: false
          aliases: false
          specifiedBy: false
          contributions: false
          reportedIn: false
          hasEvidenceItems: false
          strengthOfEvidenceProvided: false
          scoreOfEvidenceProvided: false
          directionOfEvidenceProvided:
            type: string
            const: supports
            description: Always 'supports'.
          evidenceOutcome:
            allOf:
              - $refCurie: clinvar-gkm:ClinvarTerm
              - type: object
                properties:
                  conceptType:
                    type: string
                    const: Outcome
                    description: Always 'Outcome'.
            description: >-
              The evidence level for the AMP/ASCO/CAP tier, as a ClinvarTerm of concept type
              'Outcome': 'Level A/B' for Tier I, 'Level C/D' for Tier II; for any other tier,
              the SCV's classification code.
          targetProposition:
            $refCurie: gkm.core:iriReference
            pattern: "^#/propositionSomaticClinicalImpact/"
            description: >-
              The specific assertion, a '#/propositionSomaticClinicalImpact/<id>' pointer
              to a VariantTherapeuticResponseProposition, VariantDiagnosticProposition or
              VariantPrognosticProposition in this bundle.
          extensions:
            type: array
            ordered: false
            items:
              oneOf:
                - $ref: "#/$defs/ExtensionEvidenceLineSubmittedCondition"
                - $ref: "#/$defs/ExtensionEvidenceLineSubmittedConditionSet"
            description: >-
              The submitter's original condition, in an ExtensionEvidenceLineSubmittedCondition,
              or conditions, in an ExtensionEvidenceLineSubmittedConditionSet.
