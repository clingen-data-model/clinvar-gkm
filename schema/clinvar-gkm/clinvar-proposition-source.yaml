$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://w3id.org/clingen/schema/clinvar-gkm/1.1.0/clinvar-proposition-source.yaml"
title: ClinVar-GKM proposition profiles
description: >-
  Profiles of the VA-Spec proposition types for the records of the four proposition bundle
  sections, the qualifiers they carry, and the custom proposition types for ClinVar
  submission categories that have no VA-Spec proposition type. Each profile composes its
  GA4GH base class and narrows it to what the ClinVar-GKM pipeline writes: a property the
  pipeline never writes is declared false, the subject, object and condition qualifier are
  pointers carrying the pattern of the sections they name, and the gene context, mode of
  inheritance and penetrance qualifiers are inline ClinVar qualifier classes.
strict: true

imports:
  va-spec: ../va-spec/va-spec-source.yaml
  domain-entities: ../va-spec/domain-entities-source.yaml
  cat-vrs: ../cat-vrs/cat-vrs-source.yaml
  vrs: ../vrs/vrs-source.yaml
  gkm-core: ../gkm-core/gkm-core-source.yaml
  clinvar-concept: ./clinvar-concept-source.yaml

namespaces:
  gkm.core: /ga4gh/schema/gkm-core/1.3.0/json/
  vrs: /ga4gh/schema/vrs/2.1.1/json/
  cat-vrs: /ga4gh/schema/cat-vrs/1.1.1/json/
  va-spec: /ga4gh/schema/va-spec/1.1.0/json/
  domain-entities: /ga4gh/schema/va-spec/1.1.0/json/
  clinvar-gkm: /clingen/schema/clinvar-gkm/1.1.0/json/

$defs:
  # ─── Gene context qualifier ───

  ExtensionGeneContextSource:
    type: object
    maturity: trial use
    description: >-
      Where the gene on a SCV proposition's geneContextQualifier came from, compared with
      the gene symbols the submitter gave.
    protectedClassOf: ClinvarGeneContextQualifier
    properties:
      name:
        type: string
        const: geneContextSource
        description: Must be 'geneContextSource'.
      value:
        type: string
        enum:
          - submittedSymbolMatches
          - submittedSymbolDiffers
          - inferredFromVariant
          - submittedNotNormalized
        description: >-
          submittedSymbolMatches: the submitter's symbols include the qualifier's symbol.
          submittedSymbolDiffers: the submitter gave symbols, but none equals the qualifier's
          symbol (most are previous symbols of the same gene). inferredFromVariant: the
          submitter gave no symbols. submittedNotNormalized: the variant has no single
          representative gene, so the qualifier is a placeholder named with the submitter's
          symbol(s). Symbols are compared trimmed and case-insensitively.
    required: [name, value]

  ExtensionSubmittedGeneSymbols:
    type: object
    maturity: trial use
    description: >-
      The gene symbols the submitter gave for the SCV, as submitted.
    protectedClassOf: ClinvarGeneContextQualifier
    properties:
      name:
        type: string
        const: submittedGeneSymbols
        description: Must be 'submittedGeneSymbols'.
      value:
        type: array
        ordered: true
        items:
          type: string
        description: The submitted gene symbols.
    required: [name, value]

  ClinvarGeneContextQualifier:
    maturity: trial use
    description: >-
      The gene context qualifier on a ClinVar SCV proposition: a gene MappableConcept with the
      codings of a ClinvarGene, and extensions saying where its gene came from
      (ExtensionGeneContextSource) and which gene symbols the submitter gave
      (ExtensionSubmittedGeneSymbols). No id, description or aliases.
    allOf:
      - $refCurie: gkm.core:MappableConcept
      - type: object
        properties:
          id: false
          description: false
          aliases: false
          conceptType:
            type: string
            const: gene
            description: Always 'gene'.
          primaryCoding:
            $refCurie: clinvar-gkm:ClinvarCoding
            description: >-
              The gene's NCBI Gene coding. Absent on a placeholder qualifier
              (geneContextSource 'submittedNotNormalized').
          mappings:
            type: array
            ordered: false
            items:
              $refCurie: clinvar-gkm:ClinvarConceptMapping
            description: >-
              Mappings of the gene to other gene codes (its HGNC coding). Absent on a
              placeholder qualifier.
          extensions:
            type: array
            ordered: false
            items:
              oneOf:
                - $ref: "#/$defs/ExtensionGeneContextSource"
                - $ref: "#/$defs/ExtensionSubmittedGeneSymbols"
            description: >-
              The qualifier's extensions, each an ExtensionGeneContextSource or an
              ExtensionSubmittedGeneSymbols.

  # ─── Mode of inheritance qualifier ───

  ExtensionSubmittedModeOfInheritance:
    type: object
    maturity: trial use
    description: >-
      The mode of inheritance the submitter gave for the SCV, as submitted.
    protectedClassOf: ClinvarModeOfInheritanceQualifier
    properties:
      name:
        type: string
        const: submittedModeOfInheritance
        description: Must be 'submittedModeOfInheritance'.
      value:
        type: string
        description: The submitted mode of inheritance.
    required: [name, value]

  ClinvarModeOfInheritanceQualifier:
    maturity: trial use
    description: >-
      The mode of inheritance qualifier on a ClinVar SCV proposition: a MappableConcept named
      by the submitted mode of inheritance, with its HPO coding when the name matches an HPO
      term, and the submitted value in an ExtensionSubmittedModeOfInheritance. No id,
      description, aliases or mappings.
    allOf:
      - $refCurie: gkm.core:MappableConcept
      - type: object
        properties:
          id: false
          description: false
          aliases: false
          mappings: false
          conceptType:
            type: string
            const: modeOfInheritance
            description: Always 'modeOfInheritance'.
          primaryCoding:
            $refCurie: clinvar-gkm:ClinvarCoding
            description: >-
              The HPO term whose label matches the submitted mode of inheritance
              (case-insensitively). Absent when no HPO term matches.
          extensions:
            type: array
            ordered: false
            items:
              $ref: "#/$defs/ExtensionSubmittedModeOfInheritance"
            description: The submitted mode of inheritance, in an ExtensionSubmittedModeOfInheritance.

  # ─── Penetrance qualifier ───

  ExtensionSubmittedClassification:
    type: object
    maturity: trial use
    description: >-
      The SCV's submitted classification that the penetrance qualifier was derived from.
    protectedClassOf: ClinvarPenetranceQualifier
    properties:
      name:
        type: string
        const: submittedClassification
        description: Must be 'submittedClassification'.
      value:
        type: string
        description: The submitted classification (e.g. 'Likely risk allele').
    required: [name, value]

  ClinvarPenetranceQualifier:
    maturity: trial use
    description: >-
      The penetrance qualifier on a ClinVar SCV proposition, derived from a low-penetrance or
      risk-allele classification: a MappableConcept named 'low' or 'risk', with the submitted
      classification in an ExtensionSubmittedClassification. No id, description, aliases,
      primary coding or mappings.
    allOf:
      - $refCurie: gkm.core:MappableConcept
      - type: object
        properties:
          id: false
          description: false
          aliases: false
          primaryCoding: false
          mappings: false
          conceptType:
            type: string
            const: penetrance
            description: Always 'penetrance'.
          name:
            type: string
            enum:
              - low
              - risk
            description: >-
              'low' for a pathogenic or likely pathogenic, low penetrance classification;
              'risk' for an established, likely or uncertain risk allele classification.
          extensions:
            type: array
            ordered: false
            items:
              $ref: "#/$defs/ExtensionSubmittedClassification"
            description: The submitted classification, in an ExtensionSubmittedClassification.

  # ─── VA-Spec proposition profiles ───

  ClinvarVariantPathogenicityProposition:
    maturity: trial use
    description: >-
      A record of the propositionPathogenicity section: a VariantPathogenicityProposition
      whose subject is a variation pointer and whose object is a condition or condition set
      pointer. SCV propositions may carry gene context, mode of inheritance and penetrance
      qualifiers; VCV and RCV propositions carry none. No name, description, aliases,
      extensions or allele origin qualifier.
    allOf:
      - $refCurie: va-spec:VariantPathogenicityProposition
      - type: object
        properties:
          name: false
          description: false
          aliases: false
          extensions: false
          alleleOriginQualifier: false
          subject:
            $refCurie: gkm.core:iriReference
            pattern: "^#/variation/"
            description: The variant, a '#/variation/<id>' pointer into this bundle.
          object:
            $refCurie: gkm.core:iriReference
            pattern: "^#/(condition|conditionSet)/"
            description: >-
              The condition, a '#/condition/<id>' or '#/conditionSet/<id>' pointer into
              this bundle.
          geneContextQualifier:
            $ref: "#/$defs/ClinvarGeneContextQualifier"
            description: The variant's gene (SCV propositions only).
          modeOfInheritanceQualifier:
            $ref: "#/$defs/ClinvarModeOfInheritanceQualifier"
            description: The submitted mode of inheritance (SCV propositions only).
          penetranceQualifier:
            $ref: "#/$defs/ClinvarPenetranceQualifier"
            description: >-
              The penetrance implied by a low-penetrance or risk-allele classification (SCV
              propositions only).

  ClinvarVariantOncogenicityProposition:
    maturity: trial use
    description: >-
      A record of the propositionOncogenicity section: a VariantOncogenicityProposition whose
      subject is a variation pointer and whose object is a condition or condition set pointer.
      SCV propositions may carry a gene context qualifier. No name, description, aliases,
      extensions or allele origin qualifier.
    allOf:
      - $refCurie: va-spec:VariantOncogenicityProposition
      - type: object
        properties:
          name: false
          description: false
          aliases: false
          extensions: false
          alleleOriginQualifier: false
          subject:
            $refCurie: gkm.core:iriReference
            pattern: "^#/variation/"
            description: The variant, a '#/variation/<id>' pointer into this bundle.
          object:
            $refCurie: gkm.core:iriReference
            pattern: "^#/(condition|conditionSet)/"
            description: >-
              The tumor type, a '#/condition/<id>' or '#/conditionSet/<id>' pointer into
              this bundle.
          geneContextQualifier:
            $ref: "#/$defs/ClinvarGeneContextQualifier"
            description: The variant's gene (SCV propositions only).

  ClinvarVariantClinicalSignificanceProposition:
    maturity: draft
    description: >-
      A somatic clinical impact proposition of the propositionSomaticClinicalImpact section: a
      VariantClinicalSignificanceProposition whose subject is a variation pointer and whose
      object is a condition or condition set pointer. SCV propositions may carry a gene
      context qualifier. No name, description, aliases, extensions or allele origin qualifier.
    allOf:
      - $refCurie: va-spec:VariantClinicalSignificanceProposition
      - type: object
        properties:
          name: false
          description: false
          aliases: false
          extensions: false
          alleleOriginQualifier: false
          subject:
            $refCurie: gkm.core:iriReference
            pattern: "^#/variation/"
            description: The variant, a '#/variation/<id>' pointer into this bundle.
          object:
            $refCurie: gkm.core:iriReference
            pattern: "^#/(condition|conditionSet)/"
            description: >-
              The condition, a '#/condition/<id>' or '#/conditionSet/<id>' pointer into
              this bundle.
          geneContextQualifier:
            $ref: "#/$defs/ClinvarGeneContextQualifier"
            description: The variant's gene (SCV propositions only).

  ClinvarVariantDiagnosticProposition:
    maturity: trial use
    description: >-
      The target proposition of a diagnostic somatic clinical impact SCV's evidence line, in
      the propositionSomaticClinicalImpact section: a VariantDiagnosticProposition whose
      subject is a variation pointer and whose object is a condition or condition set
      pointer, with the SCV's gene context qualifier. No name, description, aliases,
      extensions or allele origin qualifier.
    allOf:
      - $refCurie: va-spec:VariantDiagnosticProposition
      - type: object
        properties:
          name: false
          description: false
          aliases: false
          extensions: false
          alleleOriginQualifier: false
          subject:
            $refCurie: gkm.core:iriReference
            pattern: "^#/variation/"
            description: The variant, a '#/variation/<id>' pointer into this bundle.
          object:
            $refCurie: gkm.core:iriReference
            pattern: "^#/(condition|conditionSet)/"
            description: >-
              The disease, a '#/condition/<id>' or '#/conditionSet/<id>' pointer into this
              bundle.
          geneContextQualifier:
            $ref: "#/$defs/ClinvarGeneContextQualifier"
            description: The variant's gene.

  ClinvarVariantPrognosticProposition:
    maturity: trial use
    description: >-
      The target proposition of a prognostic somatic clinical impact SCV's evidence line, in
      the propositionSomaticClinicalImpact section: a VariantPrognosticProposition whose
      subject is a variation pointer and whose object is a condition or condition set
      pointer, with the SCV's gene context qualifier. No name, description, aliases,
      extensions or allele origin qualifier.
    allOf:
      - $refCurie: va-spec:VariantPrognosticProposition
      - type: object
        properties:
          name: false
          description: false
          aliases: false
          extensions: false
          alleleOriginQualifier: false
          subject:
            $refCurie: gkm.core:iriReference
            pattern: "^#/variation/"
            description: The variant, a '#/variation/<id>' pointer into this bundle.
          object:
            $refCurie: gkm.core:iriReference
            pattern: "^#/(condition|conditionSet)/"
            description: >-
              The disease, a '#/condition/<id>' or '#/conditionSet/<id>' pointer into this
              bundle.
          geneContextQualifier:
            $ref: "#/$defs/ClinvarGeneContextQualifier"
            description: The variant's gene.

  ClinvarVariantTherapeuticResponseProposition:
    maturity: trial use
    description: >-
      The target proposition of a therapeutic somatic clinical impact SCV's evidence line, in
      the propositionSomaticClinicalImpact section: a VariantTherapeuticResponseProposition
      whose subject is a variation pointer, whose object is a therapy or therapy group
      pointer and whose condition qualifier is a condition or condition set pointer, with the
      SCV's gene context qualifier. No name, description, aliases, extensions or allele
      origin qualifier.
    allOf:
      - $refCurie: va-spec:VariantTherapeuticResponseProposition
      - type: object
        properties:
          name: false
          description: false
          aliases: false
          extensions: false
          alleleOriginQualifier: false
          subject:
            $refCurie: gkm.core:iriReference
            pattern: "^#/variation/"
            description: The variant, a '#/variation/<id>' pointer into this bundle.
          object:
            $refCurie: gkm.core:iriReference
            pattern: "^#/(therapy|therapyGroup)/"
            description: >-
              The drug, a '#/therapy/<id>' pointer, or a combination of drugs, a
              '#/therapyGroup/<id>' pointer into this bundle.
          conditionQualifier:
            $refCurie: gkm.core:iriReference
            pattern: "^#/(condition|conditionSet)/"
            description: >-
              The disease context, a '#/condition/<id>' or '#/conditionSet/<id>' pointer
              into this bundle.
          geneContextQualifier:
            $ref: "#/$defs/ClinvarGeneContextQualifier"
            description: The variant's gene.

  # ─── ClinVar custom propositions ───

  ClinvarGermlineCustomPropositionProperties:
    abstract: true
    type: object
    maturity: trial use
    description: >-
      ClinVar-specific properties for germline custom propositions.
    protectedClassOf: ClinvarGermlineCustomProposition
    properties:
      subject:
        $refCurie: gkm.core:iriReference
        pattern: "^#/variation/"
        description: The variant, a '#/variation/<id>' pointer into this bundle.
      object:
        $refCurie: gkm.core:iriReference
        pattern: "^#/(condition|conditionSet)/"
        description: >-
          The condition the variant is associated with, a '#/condition/<id>' or
          '#/conditionSet/<id>' pointer into this bundle.
      geneContextQualifier:
        $ref: "#/$defs/ClinvarGeneContextQualifier"
        description: >-
          Reports a gene impacted by the variant, which may contribute to the association
          described in the Proposition (SCV propositions only).
      modeOfInheritanceQualifier:
        $ref: "#/$defs/ClinvarModeOfInheritanceQualifier"
        description: >-
          Reports a pattern of inheritance expected for the effect of the variant (SCV
          propositions only).
      penetranceQualifier:
        $ref: "#/$defs/ClinvarPenetranceQualifier"
        description: >-
          Reports the penetrance of the effect - the extent to which the variant impact is
          expressed by carriers (SCV propositions only).

  ClinvarGermlineCustomProposition:
    maturity: trial use
    description: >-
      A custom proposition type for ClinVar germline submissions that do not have
      a corresponding GA4GH VA-Spec proposition type. Includes ClinVar submission
      categories such as "risk factor", "protective", "drug response", "affects", "association", "confers sensitivity", "other", "not provided", and
      "conflicting data from submitters". These custom proposition types are used to represent
      variant-condition associations in ClinVar. No name, description, aliases or extensions.
    allOf:
      - $refCurie: va-spec:SubjectVariantProposition
      - $ref: "#/$defs/ClinvarGermlineCustomPropositionProperties"
      - type: object
        properties:
          name: false
          description: false
          aliases: false
          extensions: false

  ClinvarRiskFactorProposition:
    type: object
    maturity: trial use
    description: >-
      A custom proposition describing the role of a variant as a risk factor for a condition.
      Used for ClinVar submissions classified as "risk factor". ClinVar has stopped
      accepting new submissions with this classification in favor of standard
      pathogenicity terms, but historical submissions remain.
    allOf:
      - $ref: "#/$defs/ClinvarGermlineCustomProposition"
    properties:
      type:
        type: string
        const: ClinvarRiskFactorProposition
        default: ClinvarRiskFactorProposition
        description: MUST be "ClinvarRiskFactorProposition"
      predicate:
        type: string
        const: isRiskFactorFor
        default: isRiskFactorFor
        description: >-
          The relationship the Proposition describes between the subject variant
          and object condition. MUST be "isRiskFactorFor".

  ClinvarProtectiveProposition:
    type: object
    maturity: trial use
    description: >-
      A custom proposition describing the protective role of a variant against a condition.
      Used for ClinVar submissions classified as "protective". ClinVar has stopped
      accepting new submissions with this classification, but historical submissions
      remain.
    allOf:
      - $ref: "#/$defs/ClinvarGermlineCustomProposition"
    properties:
      type:
        type: string
        const: ClinvarProtectiveProposition
        default: ClinvarProtectiveProposition
        description: MUST be "ClinvarProtectiveProposition".
      predicate:
        type: string
        const: isProtectiveFor
        default: isProtectiveFor
        description: >-
          The relationship the Proposition describes between the subject variant
          and object condition. MUST be "isProtectiveFor".

  ClinvarDrugResponseProposition:
    type: object
    maturity: trial use
    description: >-
      A proposition describing the role of a variant in modulating drug response.
      Used for ClinVar submissions classified as "drug response". Distinct from
      the GA4GH VariantTherapeuticResponseProposition which is used for somatic
      clinical impact therapeutic response assertions.
    allOf:
      - $ref: "#/$defs/ClinvarGermlineCustomProposition"
    properties:
      type:
        type: string
        const: ClinvarDrugResponseProposition
        default: ClinvarDrugResponseProposition
        description: MUST be "ClinvarDrugResponseProposition".
      predicate:
        type: string
        const: hasDrugResponseFor
        default: hasDrugResponseFor
        description: >-
          The relationship the Proposition describes between the subject variant
          and object condition. MUST be "hasDrugResponseFor".
    
  ClinvarAffectsProposition:
    type: object
    maturity: trial use
    description: >-
      A proposition describing a variant that affects a condition without implying
      causality. Used for ClinVar submissions classified as "affects". ClinVar has
      stopped accepting new submissions with this classification, but historical
      submissions remain.
    allOf:
      - $ref: "#/$defs/ClinvarGermlineCustomProposition"
    properties:
      type:
        type: string
        const: ClinvarAffectsProposition
        default: ClinvarAffectsProposition
        description: MUST be "ClinvarAffectsProposition".
      predicate:
        type: string
        const: hasAffectFor
        default: hasAffectFor
        description: >-
          The relationship the Proposition describes between the subject variant
          and object condition. MUST be "hasAffectFor".

  ClinvarAssociationProposition:
    type: object
    maturity: trial use
    description: >-
      A proposition describing a statistical or observational association between
      a variant and a condition. Used for ClinVar submissions classified as
      "association". Does not imply a causal relationship.
    allOf:
      - $ref: "#/$defs/ClinvarGermlineCustomProposition"
    properties:
      type:
        type: string
        const: ClinvarAssociationProposition
        default: ClinvarAssociationProposition
        description: MUST be "ClinvarAssociationProposition".
      predicate:
        type: string
        const: isAssociatedWith
        default: isAssociatedWith
        description: >-
          The relationship the Proposition describes between the subject variant
          and object condition. MUST be "isAssociatedWith".

  ClinvarConfersSensitivityProposition:
    type: object
    maturity: trial use
    description: >-
      A proposition describing a variant that confers sensitivity to a condition
      or environmental factor. Used for ClinVar submissions classified as
      "confers sensitivity". ClinVar has stopped accepting new submissions with
      this classification, but historical submissions remain.
    allOf:
      - $ref: "#/$defs/ClinvarGermlineCustomProposition"
    properties:
      type:
        type: string
        const: ClinvarConfersSensitivityProposition
        default: ClinvarConfersSensitivityProposition
        description: MUST be "ClinvarConfersSensitivityProposition".
      predicate:
        type: string
        const: confersSensitivityFor
        default: confersSensitivityFor
        description: >-
          The relationship the Proposition describes between the subject variant
          and object condition. MUST be "confersSensitivityFor".

  ClinvarOtherProposition:
    type: object
    maturity: trial use
    description: >-
      A proposition for ClinVar submissions classified as "other" that do not fit
      any standard or named classification category. ClinVar has stopped accepting
      new submissions with this classification, but historical submissions remain.
    allOf:
      - $ref: "#/$defs/ClinvarGermlineCustomProposition"
    properties:
      type:
        type: string
        const: ClinvarOtherProposition
        default: ClinvarOtherProposition
        description: MUST be "ClinvarOtherProposition".
      predicate:
        type: string
        const: isClinvarOtherAssociationFor
        default: isClinvarOtherAssociationFor
        description: >-
          The relationship the Proposition describes between the subject variant
          and object condition. MUST be "isClinvarOtherAssociationFor".

  ClinvarNotProvidedProposition:
    type: object
    maturity: trial use
    description: >-
      A proposition for ClinVar submissions where the submitter did not provide
      a clinical classification. These submissions still carry variant-condition
      associations but lack a formal pathogenicity or clinical significance
      assessment.
    allOf:
      - $ref: "#/$defs/ClinvarGermlineCustomProposition"
    properties:
      type:
        type: string
        const: ClinvarNotProvidedProposition
        default: ClinvarNotProvidedProposition
        description: MUST be "ClinvarNotProvidedProposition".
      predicate:
        type: string
        const: hasNoProvidedClassificationFor
        default: hasNoProvidedClassificationFor
        description: >-
          The relationship the Proposition describes between the subject variant
          and object condition. MUST be "hasNoProvidedClassificationFor".

  ClinvarConflictingDataFromSubmitterProposition:
    type: object
    maturity: trial use
    description: >-
      A proposition for ClinVar submissions where the submitter's data conflicts
      with other submitters' data for the same variant-condition pair. Used for
      submissions classified as "conflicting data from submitters".
    allOf:
      - $ref: "#/$defs/ClinvarGermlineCustomProposition"
    properties:
      type:
        type: string
        const: ClinvarConflictingDataFromSubmitterProposition
        default: ClinvarConflictingDataFromSubmitterProposition
        description: MUST be "ClinvarConflictingDataFromSubmitterProposition".
      predicate:
        type: string
        const: isConflictingDataFromSubmittersFor
        default: isConflictingDataFromSubmittersFor
        description: >-
          The relationship the Proposition describes between the subject variant
          and object condition. MUST be "isConflictingDataFromSubmittersFor".

  ClinvarUndefinedProposition:
    type: object
    maturity: trial use
    description: >-
      A fallback custom proposition for a ClinVar submission whose classification does not
      map to any defined ClinVar-GKM or GA4GH proposition type. Emitted only when the upstream
      classification-to-type mapping yields no gks_type.
    allOf:
      - $ref: "#/$defs/ClinvarGermlineCustomProposition"
    properties:
      type:
        type: string
        const: ClinvarUndefinedProposition
        default: ClinvarUndefinedProposition
        description: MUST be "ClinvarUndefinedProposition"
      predicate:
        type: string
        const: isClinvarUndefinedAssociationFor
        default: isClinvarUndefinedAssociationFor
        description: >-
          The relationship the Proposition describes between the subject variant and object
          condition. MUST be "isClinvarUndefinedAssociationFor".
